<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiểm thử logic — Đập Lợn</title>
<link rel="stylesheet" href="../design/tokens.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AA%3C/text%3E%3C/svg%3E">
<style>
  body { margin: 0; padding: var(--space-6) var(--space-5); background: var(--bg-page); font-family: var(--font-body); color: var(--text-primary); }
  h1 { font-family: var(--font-display); font-stretch: var(--font-stretch-wide); font-weight: var(--weight-black); font-size: var(--text-3xl); margin: 0 0 var(--space-2); }
  #summary { font-weight: var(--weight-bold); margin-bottom: var(--space-5); }
  table { width: 100%; max-width: 980px; border-collapse: collapse; background: var(--color-white); border: var(--border-width) solid var(--color-ink); font-size: var(--text-sm); }
  th, td { text-align: left; vertical-align: top; padding: var(--space-2) var(--space-3); border-bottom: 1px solid rgba(17,17,17,.15); }
  th { background: var(--color-ink); color: var(--color-white); }
  .pass { background: var(--color-mint-200); }
  .fail { background: #FFD9D9; }
  code { font-family: var(--font-mono); font-size: var(--text-xs); }
</style>
</head>
<body>
<h1>Kiểm thử logic UT-01 → UT-09</h1>
<p id="summary">Đang chạy…</p>
<table>
  <thead><tr><th>Mã</th><th>Nội dung</th><th>Kết quả</th><th>Chi tiết</th></tr></thead>
  <tbody id="rows"></tbody>
</table>

<script src="game.js"></script>
<script>
"use strict";
var D = window.DapLon;
var C = D.CONST;

/* ---------- Đồng hồ giả + hẹn giờ giả ---------- */
function FakeClock() {
  var t = 0, seq = 0, q = [];
  var c = {
    now: function () { return t; },
    setTimeout: function (fn, ms) { var id = ++seq; q.push({ id: id, at: t + Math.max(0, ms), fn: fn, n: id }); return id; },
    clearTimeout: function (id) { q = q.filter(function (x) { return x.id !== id; }); },
    pending: function () { return q.length; },
    nextAt: function () { return q.length ? Math.min.apply(null, q.map(function (x) { return x.at; })) : Infinity; },
    // Chạy mọi hẹn giờ có thời điểm <= target theo thứ tự, gọi onStep sau mỗi hẹn giờ
    advanceTo: function (target, onStep) {
      for (;;) {
        if (!q.length) break;
        q.sort(function (a, b) { return a.at - b.at || a.n - b.n; });
        if (q[0].at > target) break;
        var job = q.shift();
        t = job.at;
        job.fn();
        if (onStep) onStep();
      }
      t = Math.max(t, target);
    },
    advance: function (ms, onStep) { c.advanceTo(t + ms, onStep); },
    set: function (v) { t = v; }
  };
  return c;
}

// Hàm ngẫu nhiên có hạt giống (mulberry32) để kết quả lặp lại được
function seeded(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var r = Math.imul(seed ^ seed >>> 15, 1 | seed);
    r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r;
    return ((r ^ r >>> 14) >>> 0) / 4294967296;
  };
}

function memStorage(init) {
  var m = Object.assign({}, init || {});
  return { getItem: function (k) { return k in m ? m[k] : null; }, setItem: function (k, v) { m[k] = String(v); }, data: m };
}

function newGame(clock, seed, storage) {
  return D.createGame({ now: clock.now, setTimeout: clock.setTimeout, clearTimeout: clock.clearTimeout, random: seeded(seed || 1), storage: storage || memStorage() });
}
var COUNTDOWN_MS = C.COUNTDOWN_STEPS.reduce(function (s, x) { return s + x[1]; }, 0);

// Chạy tới khi đang PLAYING (qua đếm ngược)
function toPlaying(g, clock) { clock.advance(COUNTDOWN_MS); if (g.state !== "PLAYING") throw new Error("không vào PLAYING, state=" + g.state); }

/* ---------- Bộ chạy ---------- */
var results = [];
function test(id, title, fn) {
  var r = { id: id, title: title };
  try { var d = fn(); r.ok = true; r.detail = d || ""; }
  catch (e) { r.ok = false; r.detail = e.message; }
  results.push(r);
}
function assert(cond, msg) { if (!cond) throw new Error(msg); }

/* ---------- UT-01 ---------- */
test("UT-01", "Chọn ô 10 000 lần: không trùng ô trước / ô bận; tần suất mỗi ô 11.1% ± 1.5%", function () {
  var rnd = seeded(42), last = null, count = new Array(9).fill(0), N = 10000;
  for (var n = 0; n < N; n++) {
    var cells = [];
    for (var i = 0; i < 9; i++) cells.push({ state: "EMPTY" });
    // 0–2 ô bận ngẫu nhiên (không tính ô trước)
    var busyN = Math.floor(rnd() * 3), busy = [];
    while (busy.length < busyN) { var b = Math.floor(rnd() * 9); if (b !== last && busy.indexOf(b) < 0) { busy.push(b); cells[b].state = rnd() < 0.5 ? "UP" : "HIT"; } }
    var p = D.pickCell(cells, last, rnd);
    assert(p !== null, "không chọn được ô");
    assert(p !== last, "trùng ô trước ở lần " + n);
    assert(busy.indexOf(p) < 0, "chọn trúng ô bận ở lần " + n);
    count[p]++; last = p;
  }
  var pct = count.map(function (c) { return c / N * 100; });
  pct.forEach(function (x, i) { assert(Math.abs(x - 100 / 9) <= 1.5, "ô " + i + " = " + x.toFixed(2) + "%"); });
  return "Tần suất: " + pct.map(function (x) { return x.toFixed(1) + "%"; }).join(", ");
});

/* ---------- UT-02 ---------- */
test("UT-02", "Chặng theo thời gian đã chơi 0, 9.99, 10, 19.99, 20, 29.99 s", function () {
  var input = [0, 9990, 10000, 19990, 20000, 29990], expect = [1, 1, 2, 2, 3, 3];
  var got = input.map(function (ms) { return D.phaseFor(ms).id; });
  assert(JSON.stringify(got) === JSON.stringify(expect), "nhận " + got.join(","));
  return "Chặng: " + got.join(", ");
});

/* ---------- UT-03 ---------- */
test("UT-03", "Mô phỏng 1 000 lượt: số lợn cùng lúc ≤ tối đa; thời gian hiện và nghỉ đúng khoảng", function () {
  var spawns = 0, hits = 0, maxSeen = [0, 0, 0, 0], late = 0;
  for (var r = 0; r < 1000; r++) {
    var clock = FakeClock(), g = newGame(clock, r + 1), rnd = seeded(9000 + r);
    g.on("schedule", function (gap, phaseId) {
      var p = D.PHASES[phaseId - 1];
      assert(gap >= p.gap[0] && gap <= p.gap[1], "khoảng nghỉ " + gap.toFixed(0) + " ngoài khoảng chặng " + phaseId);
    });
    g.on("spawn", function (idx, showMs, phaseId, busy) {
      spawns++;
      var p = D.PHASES[phaseId - 1];
      assert(showMs >= p.show[0] && showMs <= p.show[1], "thời gian hiện " + showMs.toFixed(0) + " ngoài khoảng chặng " + phaseId);
      assert(busy <= p.max, "chặng " + phaseId + " có " + busy + " lợn");
      var expPhase = D.phaseFor(C.ROUND_MS - g.remaining()).id;
      assert(expPhase === phaseId, "sai chặng");
      if (g.remaining() < C.MIN_REMAINING_TO_SPAWN_MS) late++;
      maxSeen[phaseId] = Math.max(maxSeen[phaseId], busy);
      // 50% số lợn bị đập vào một lúc ngẫu nhiên khi đang hiện
      if (rnd() < 0.5) {
        var when = rnd() * showMs * 0.95;
        clock.setTimeout(function () { if (g.hit(idx)) hits++; }, when);
      }
    });
    g.start();
    toPlaying(g, clock);
    var guard = 0;
    while (g.state === "PLAYING" && guard++ < 10000) {
      var target = Math.min(clock.nextAt(), clock.now() + 16);
      clock.advanceTo(target);
      g.tick();
    }
    assert(g.state === "ENDING", "lượt " + r + " không kết thúc");
  }
  assert(late === 0, late + " lợn sinh khi còn < 300 ms");
  assert(maxSeen[1] === 1 && maxSeen[2] === 2 && maxSeen[3] === 2, "tối đa quan sát được: " + maxSeen.slice(1).join("/"));
  return spawns + " lần xuất hiện, " + hits + " lần trúng; tối đa cùng lúc theo chặng: " + maxSeen.slice(1).join(" / ");
});

/* ---------- UT-04 ---------- */
test("UT-04", "Bấm theo trạng thái ô và trạng thái game: chỉ PLAYING + UP + còn giờ được +1", function () {
  var clock = FakeClock(), g = newGame(clock, 7);
  assert(g.hit(0) === false, "IDLE vẫn tính điểm");
  g.start();
  assert(g.hit(0) === false && g.score === 0, "COUNTDOWN vẫn tính điểm");
  toPlaying(g, clock);
  clock.advance(C.FIRST_SPAWN_DELAY_MS);
  var up = g.cells.findIndex(function (c) { return c.state === "UP"; });
  assert(up >= 0, "không có lợn sau 300 ms");
  var empty = g.cells.findIndex(function (c) { return c.state === "EMPTY"; });
  assert(g.hit(empty) === false && g.score === 0, "ô EMPTY được điểm");
  assert(g.hit(up) === true && g.score === 1, "ô UP không được +1");
  assert(g.cells[up].state === "HIT", "ô không chuyển HIT");
  assert(g.hit(up) === false && g.hit(up) === false && g.score === 1, "ô HIT được điểm thêm");
  // Lợn hết thời gian hiện thì không còn tính
  // Chặng 1: hiện tối đa 1 000 ms, nghỉ ≥ 600 ms, nên sau 1 001 ms ô đó chắc chắn đã EMPTY
  var clk = FakeClock(), g2 = newGame(clk, 8);
  g2.start(); toPlaying(g2, clk); clk.advance(C.FIRST_SPAWN_DELAY_MS);
  var i2 = g2.cells.findIndex(function (c) { return c.state === "UP"; });
  clk.advance(1001);
  assert(g2.cells[i2].state === "EMPTY", "lợn chưa thụt xuống");
  assert(g2.hit(i2) === false && g2.score === 0, "lợn đã thụt xuống vẫn được điểm");
  // Hết giờ nhưng khung hình chưa cập nhật
  var clk3 = FakeClock(), g3 = newGame(clk3, 9);
  g3.start(); toPlaying(g3, clk3);
  var guard = 0;
  while (!g3.cells.some(function (c) { return c.state === "UP"; }) && guard++ < 100) clk3.advanceTo(clk3.nextAt());
  var i3 = g3.cells.findIndex(function (c) { return c.state === "UP"; });
  clk3.set(g3.endAt + 1);
  assert(g3.hit(i3) === false, "bấm sau hết giờ vẫn được điểm");
  assert(g3.state === "ENDING", "không chuyển ENDING");
  return "IDLE, COUNTDOWN, EMPTY, HIT, sau hết giờ: 0 điểm; UP: +1";
});

/* ---------- UT-05 ---------- */
test("UT-05", "Đồng hồ: 29 999 ms hiện 1; thêm 1 ms hiện 0 và vào ENDING đúng 30 000 ms", function () {
  var clock = FakeClock(), g = newGame(clock, 3);
  g.start(); toPlaying(g, clock);
  var t0 = clock.now();
  assert(g.displaySeconds() === 30, "lúc đầu hiện " + g.displaySeconds());
  clock.advanceTo(t0 + 29999, function () { g.tick(); });
  g.tick();
  assert(g.state === "PLAYING", "kết thúc sớm");
  assert(g.displaySeconds() === 1, "29 999 ms hiện " + g.displaySeconds());
  clock.advanceTo(t0 + 30000);
  g.tick();
  assert(g.displaySeconds() === 0, "30 000 ms hiện " + g.displaySeconds());
  assert(g.state === "ENDING", "không vào ENDING");
  clock.advance(C.ENDING_MS);
  assert(g.state === "RESULT", "không sang RESULT sau 800 ms");
  return "30 → 1 → 0, ENDING đúng 30 000 ms, RESULT sau 800 ms";
});

/* ---------- UT-06 ---------- */
test("UT-06", "Tạm dừng tại 12 345 ms còn lại, chờ 60 s, tiếp tục: còn đúng 12 345 ms", function () {
  var clock = FakeClock(), g = newGame(clock, 5);
  g.start(); toPlaying(g, clock);
  clock.advanceTo(g.endAt - 12345, function () { g.tick(); });
  assert(g.pause() === true && g.state === "PAUSED", "không tạm dừng được");
  assert(g.remainingMs === 12345, "lưu " + g.remainingMs);
  assert(g.cells.every(function (c) { return c.state === "EMPTY"; }), "còn lợn khi tạm dừng");
  assert(clock.pending() === 0, "còn " + clock.pending() + " hẹn giờ khi tạm dừng");
  var scoreBefore = g.score;
  clock.advance(60000);
  assert(g.remainingMs === 12345, "thời gian bị trừ khi tạm dừng");
  g.resume();
  assert(g.state === "COUNTDOWN", "không đếm lại 3-2-1");
  clock.advance(COUNTDOWN_MS);
  assert(g.state === "PLAYING", "không vào PLAYING");
  assert(Math.round(g.remaining()) === 12345, "còn " + g.remaining());
  assert(g.displaySeconds() === 13, "hiện " + g.displaySeconds());
  assert(D.phaseFor(C.ROUND_MS - g.remaining()).id === 2, "sai chặng sau khi tiếp tục");
  assert(g.score === scoreBefore, "điểm thay đổi");
  // Rời tab trong lúc đếm ngược
  var c2 = FakeClock(), g2 = newGame(c2, 6);
  g2.start(); c2.advance(1500);
  assert(g2.pause() && g2.state === "PAUSED" && g2.remainingMs === 30000, "tạm dừng khi đếm ngược sai");
  return "12 345 ms giữ nguyên qua 60 s tạm dừng; tiếp tục đúng chặng 2";
});

/* ---------- UT-07 ---------- */
test("UT-07", "Lượt mới không bị hẹn giờ của lượt cũ ảnh hưởng (10 lượt liên tiếp)", function () {
  var clock = FakeClock(), g = newGame(clock, 11);
  for (var r = 0; r < 10; r++) {
    assert(g.start() === true, "không bắt đầu được lượt " + (r + 1));
    assert(g.score === 0 && g.remainingMs === 30000, "lượt " + (r + 1) + " không đặt lại");
    assert(clock.pending() === 1, "lượt " + (r + 1) + " có " + clock.pending() + " hẹn giờ ngay khi bắt đầu");
    toPlaying(g, clock);
    var t0 = clock.now();
    while (g.state === "PLAYING") { clock.advanceTo(Math.min(clock.nextAt(), clock.now() + 16)); g.tick(); }
    assert(Math.round(clock.now() - t0) <= 30016, "lượt " + (r + 1) + " dài " + (clock.now() - t0));
    clock.advance(C.ENDING_MS);
    assert(g.state === "RESULT", "không tới RESULT");
    assert(clock.pending() === 0, "lượt " + (r + 1) + " còn " + clock.pending() + " hẹn giờ ở RESULT");
  }
  // Bấm Bắt đầu 2 lần liên tiếp
  var c2 = FakeClock(), g2 = newGame(c2, 12);
  assert(g2.start() === true && g2.start() === false, "bấm 2 lần tạo 2 lượt");
  assert(c2.pending() === 1, "bấm 2 lần tạo " + c2.pending() + " hẹn giờ");
  return "10 lượt: 0 hẹn giờ thừa ở RESULT; bấm Bắt đầu 2 lần chỉ tạo 1 lượt";
});

/* ---------- UT-08 ---------- */
test("UT-08", "Đọc kỷ lục: null, \"abc\", \"-1\", \"2.5\", \"99999\", \"42\" → 0, 0, 0, 0, 0, 42", function () {
  var input = [null, "abc", "-1", "2.5", "99999", "42"];
  var got = input.map(D.parseHighScore);
  assert(JSON.stringify(got) === "[0,0,0,0,0,42]", "nhận " + JSON.stringify(got));
  var g = D.createGame({ storage: memStorage({ "dapLon.highScore": "abc" }) });
  assert(g.highScore === 0, "game đọc dữ liệu hỏng thành " + g.highScore);
  return "Kết quả: " + got.join(", ");
});

/* ---------- UT-09 ---------- */
test("UT-09", "Cập nhật kỷ lục với điểm nhỏ hơn, bằng, lớn hơn", function () {
  var a = D.updateHighScore(4, 5), b = D.updateHighScore(5, 5), c = D.updateHighScore(6, 5);
  assert(!a.isNew && a.high === 5, "nhỏ hơn");
  assert(!b.isNew && b.high === 5, "bằng");
  assert(c.isNew && c.high === 6, "lớn hơn");
  // Tích hợp: chơi 1 lượt, đập trúng vài lợn, kiểm tra ghi vào lưu trữ
  var st = memStorage({ "dapLon.highScore": "0" }), clock = FakeClock(), g = newGame(clock, 21, st);
  g.on("spawn", function (idx) { clock.setTimeout(function () { g.hit(idx); }, 100); });
  g.start(); toPlaying(g, clock);
  while (g.state === "PLAYING") { clock.advanceTo(Math.min(clock.nextAt(), clock.now() + 16)); g.tick(); }
  assert(g.score > 0, "không ghi được điểm nào");
  assert(g.isNewRecord && st.data["dapLon.highScore"] === String(g.score), "không lưu kỷ lục mới");
  // Lượt sau không đập: không phải kỷ lục, lưu trữ giữ nguyên
  clock.advance(C.ENDING_MS);
  var saved = st.data["dapLon.highScore"];
  var g2 = newGame(FakeClock(), 22, st);
  assert(g2.highScore === Number(saved), "lượt sau đọc kỷ lục sai");
  return "4/5/6 so với 5 → chỉ 6 là kỷ lục; lượt tích hợp ghi " + saved + " vào dapLon.highScore";
});

/* ---------- Hiển thị ---------- */
var pass = results.filter(function (r) { return r.ok; }).length;
document.getElementById("summary").textContent = pass + "/" + results.length + " đạt";
document.getElementById("rows").innerHTML = results.map(function (r) {
  return '<tr class="' + (r.ok ? "pass" : "fail") + '"><td><code>' + r.id + "</code></td><td>" + r.title + "</td><td><strong>" + (r.ok ? "Đạt" : "Không đạt") + "</strong></td><td>" + String(r.detail).replace(/</g, "&lt;") + "</td></tr>";
}).join("");
window.TEST_RESULTS = results;
</script>
</body>
</html>
